apiVersion: apps/v1
kind: Deployment
metadata:
 name: backend
 labels:
   app: backend
spec:
 replicas: 1
 selector:
  matchLabels: 
   app: backend
 template:
  metadata:
   labels:
    app: backend
  spec:
    imagePullSecrets:
     - name: ghcr-secret      
    containers:
     - name: backend
       image: ghcr.io/adziaaa/backend:latest
       ports:
        - containerPort: 9000
       env:
        - name: REDIS_DNS
          valueFrom: 
            configMapKeyRef:
             name: app-config
             key: REDIS_DNS 

