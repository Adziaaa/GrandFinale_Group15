name: Continuous Integration pipeline 03automation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
  #using and adding  go (locally also we had to install it since we are using go for our project)
#clone
    steps:
    - uses: actions/checkout@v3
#install go there
    - uses: actions/setup-go@v4
      with:
        go-version: '1.16'

        
    # building backend and frontend
    - run: go build
      working-directory: ./frontend
    
    - run: go build
      working-directory: ./backend
    #running app
    - run: go test
      working-directory: ./frontend
