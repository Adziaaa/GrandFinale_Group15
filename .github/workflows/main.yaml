name: pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      # grab the code from the repo
    
    - uses: actions/setup-go@v4
      # set up Go to build and test 
      with:
        go-version: '1.16'
    
    - run: go build
      working-directory: ./frontend
    
    - run: go build
      working-directory: ./backend
    
    - run: go test
      working-directory: ./frontend
#04testing task 
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Start services
      # Use 'docker compose' (not docker-compose) - it's built-in
      run: docker compose up -d
    
    - name: Wait for services
      # let the services boot up for a sec
      run: sleep 10
    
    - name: Run tests
      # test all the endpoints
      run: bash test.sh
      # tests gotta pass or the PR gets blocked - no bad code on main

  push:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # only upload to registry when code hits main
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v3
    
    - name: Login to registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ env.OWNER }}
        # log in with GitHub token
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build and push frontend
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        # upload the image to the container registry
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/frontend:latest
    
    - name: Build and push backend
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/backend:latest

  # deploy to Kubernetes cluster

deploy:
  needs: [build, test, push]
  runs-on: ubuntu-latest
  environment: production
  if: github.ref == 'refs/heads/main'
  steps:
  - uses: actions/checkout@v3

  - name: Deploy to Kubernetes
    env:
      KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}
    run: bash deploy.sh